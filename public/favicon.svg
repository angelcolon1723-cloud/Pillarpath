<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1132"/>
      <stop offset="1" stop-color="#04060e"/>
    </linearGradient>
    <radialGradient id="pp-nebA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-nebB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pp-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="pp-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <clipPath id="pp-clip">
      <rect x="8" y="8" width="496" height="496" rx="116"/>
    </clipPath>
  </defs>
  <g clip-path="url(#pp-clip)">
    <rect x="8" y="8" width="496" height="496" fill="url(#pp-bg)"/>
    <ellipse cx="150" cy="118" rx="230" ry="190" fill="url(#pp-nebA)"/>
    <ellipse cx="372" cy="412" rx="240" ry="200" fill="url(#pp-nebB)"/>
    <g fill="#ffffff">
      <circle cx="92" cy="116" r="5" opacity="0.9"/>
      <circle cx="428" cy="308" r="4" opacity="0.7"/>
      <circle cx="104" cy="396" r="5" opacity="0.6"/>
      <circle cx="64" cy="262" r="3" opacity="0.5"/>
      <circle cx="452" cy="182" r="3" opacity="0.55"/>
      <circle cx="204" cy="78" r="3" opacity="0.5"/>
      <circle cx="332" cy="442" r="3" opacity="0.45"/>
    </g>
    <ellipse cx="290" cy="252" rx="150" ry="145" fill="#22d3ee" opacity="0.16" filter="url(#pp-glow)"/>
    <!-- P: pillar stem + orbit-ring bowl -->
    <rect x="184" y="148" width="58" height="220" rx="29" fill="url(#pp-neon)"/>
    <circle cx="298" cy="234" r="64" fill="none" stroke="url(#pp-neon)" stroke-width="56"/>
    <!-- sparkle -->
    <path d="M396 82 L404 104 L426 112 L404 120 L396 142 L388 120 L366 112 L388 104 Z" fill="#bef264"/>
  </g>
</svg>
