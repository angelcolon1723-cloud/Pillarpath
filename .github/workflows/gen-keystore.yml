name: Generate shared debug keystore (one-time)

# TEMPORARY workflow: generates ONE shared debug keystore so every beta APK
# build signs with the same key and installs cleanly over previous betas.
# Delete this file after the keystore has been committed to android/app/debug.keystore.

on:
  workflow_dispatch:

jobs:
  gen-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -keystore /tmp/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10950 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -l /tmp/debug.keystore
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-debug-keystore
          path: /tmp/debug.keystore
