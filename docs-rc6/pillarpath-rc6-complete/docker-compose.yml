version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: pillarpath-postgres
    environment:
      POSTGRES_USER: pillarpath
      POSTGRES_PASSWORD: pillarpath-dev-password-change-in-prod
      POSTGRES_DB: pillarpath
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pillarpath-postgres-data:/var/lib/postgresql/data
      # Optional: mount migrations directory
      # - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pillarpath"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pillarpath

  redis:
    image: redis:7-alpine
    container_name: pillarpath-redis
    ports:
      - "6379:6379"
    volumes:
      - pillarpath-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pillarpath

  app:
    build:
      context: ./pillarpath-work
      dockerfile: Dockerfile
    container_name: pillarpath-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://pillarpath:pillarpath-dev-password-change-in-prod@postgres:5432/pillarpath
      
      # Auth
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here-minimum-32-characters-required}
      AUTH_URL: http://localhost:8080
      
      # App
      NODE_ENV: production
      PORT: 8080
      
      # Redis (optional, for sessions/cache)
      REDIS_URL: redis://redis:6379
      
      # Stripe (optional, get from Stripe dashboard)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      
      # Dropship API (optional)
      DROPSHIP_API_KEY: ${DROPSHIP_API_KEY:-}
      
    ports:
      - "8080:8080"
    volumes:
      - ./pillarpath-work:/app
      - /app/node_modules  # Don't overwrite node_modules
    networks:
      - pillarpath
    restart: unless-stopped

volumes:
  pillarpath-postgres-data:
    driver: local
  pillarpath-redis-data:
    driver: local

networks:
  pillarpath:
    driver: bridge
